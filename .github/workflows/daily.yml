name: 每日更新节点订阅

on:
  schedule:
    # UTC 20:00 = 北京时间 04:00。改时间改这里（注意是 UTC）。
    - cron: "0 20 * * *"
  workflow_dispatch: {}      # 支持手动点一下立即跑
  push:
    branches: [main]
    # 只在自己改代码时跑。机器人提交的产物(out/、data/)不触发，
    # 否则每次提交都会再跑一轮，形成无限循环。
    paths-ignore:
      - "out/**"
      - "data/**"
      - "*.md"
      - "**/*.md"

permissions:
  contents: write            # 需要把产物 commit 回仓库

concurrency:
  group: daily-sub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 下载 mihomo 内核
        run: |
          set -euo pipefail
          mkdir -p bin data out
          URL=$(curl -sL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux-amd64.*\\.gz$"))
                     | select(.name | test("compatible") | not)
                     | .browser_download_url' | head -1)
          echo "下载: $URL"
          curl -sL -o /tmp/m.gz "$URL"
          gunzip -c /tmp/m.gz > bin/mihomo
          chmod +x bin/mihomo
          ./bin/mihomo -v

      - name: 采集节点
        run: |
          set -uo pipefail
          # 云端直连, 不需要代理。失败了也继续 —— 用仓库里上一次的 nodes.json 重测。
          python3 collect.py --max-age 72 || echo "::warning::采集失败, 沿用上一次的节点列表"

      - name: 筛选并生成订阅
        run: python3 ci_build.py --keep 40 --delay-limit 3000

      - name: 提交结果
        id: commit
        run: |
          set -uo pipefail
          git config user.name  "nodepool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A out data/pool_history.json data/nodes.json
          if git diff --staged --quiet; then
            echo "没有变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: 更新订阅 $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 刷新 CDN 缓存
        # 订阅走 jsDelivr(国内可直连)，但它会把 branch 引用缓存最长 12 小时。
        # 注意: 清缓存不是立刻生效，实测要几十秒。所以清完必须回来校验，
        # 直到 CDN 吐出的第一行和仓库里的文件一致，才算真的同步了。
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -uo pipefail
          BASE="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main"
          EXPECT="$(head -1 out/sub.yaml)"      # 仓库里这份的真实时间戳
          echo "期望: $EXPECT"
          sleep 10                              # 等 github 自身的内容分发落定
          for attempt in 1 2 3 4 5; do
            for f in out/sub.yaml out/sub-base64.txt; do
              curl -s --max-time 20 \
                "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${f}" >/dev/null \
                || echo "  purge $f 请求失败(忽略)"
            done
            sleep 15
            HEAD="$(curl -s --max-time 20 "${BASE}/out/sub.yaml" | head -1 || true)"
            echo "第 ${attempt} 次校验: ${HEAD}"
            if [ "$HEAD" = "$EXPECT" ]; then
              echo "✅ CDN 已同步到最新"
              exit 0
            fi
          done
          echo "::warning::CDN 刷新 5 次仍未同步，最迟 12 小时后自动过期"

      - name: 保存产物(便于在 Actions 页面直接下载)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscription-${{ github.run_number }}
          path: |
            out/sub.yaml
            out/sub-base64.txt
            out/report.md
          retention-days: 14

name: 更新节点订阅

on:
  schedule:
    # 拆成两种节奏: 源站不会几小时就更新一批新节点, 但节点本身几小时就会死。
    # 所以"采集"每天一次就够, "复测"要跟着节点的寿命走。
    #
    # ① UTC 20:00 = 北京 04:00 —— 全量: 采集源站 + 复测 + 重建订阅
    - cron: "0 20 * * *"
    # ② 其余时段每 3 小时 —— 只复测池内节点 + 重建订阅, 不打扰源站
    - cron: "0 2,5,8,11,14,17,23 * * *"
  workflow_dispatch: {}      # 支持手动点一下立即跑
  # 手机端反馈通道: 提一个 issue 写下"哪几个节点连不上", 云端据此把它们
  # 摘掉并重建订阅。人在外面、电脑关着也能用 —— 不需要任何本机参与。
  issues:
    types: [opened, edited]
  push:
    branches: [main]
    # 只在自己改代码时跑。机器人提交的产物(out/、data/)不触发，
    # 否则每次提交都会再跑一轮，形成无限循环。
    paths-ignore:
      - "out/**"
      - "data/**"
      - "*.md"
      - "**/*.md"

permissions:
  contents: write            # 需要把产物 commit 回仓库
  actions: write             # 反馈处理完后要手动触发一次重建
  issues: write              # 处理完在 issue 里回复结果(手机上看得到)

concurrency:
  group: daily-sub
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 代码自检
        # 28 项边界测试, 不需要网络和内核, 5 秒内跑完。
        # 放在最前面: 代码有结构性问题就立刻停, 不用等下载内核和跑完测速才发现。
        run: |
          pip install --quiet pyyaml
          python3 selfcheck.py

      - name: 下载 mihomo 内核
        run: |
          set -euo pipefail
          mkdir -p bin data out
          URL=$(curl -sL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux-amd64.*\\.gz$"))
                     | select(.name | test("compatible") | not)
                     | .browser_download_url' | head -1)
          echo "下载: $URL"
          curl -sL -o /tmp/m.gz "$URL"
          gunzip -c /tmp/m.gz > bin/mihomo
          chmod +x bin/mihomo
          ./bin/mihomo -v

      - name: 采集节点
        # 只有 04:00 那轮全量跑。其余轮次源站没有新东西, 重复抓只是给
        # 频道和订阅源增加无意义的请求, 还容易被限流。
        if: github.event_name != 'schedule' || github.event.schedule == '0 20 * * *'
        run: |
          set -uo pipefail
          # 云端直连, 不需要代理。失败了也继续 —— 用仓库里上一次的 nodes.json 重测。
          python3 collect.py --max-age 72 || echo "::warning::采集失败, 沿用上一次的节点列表"

      - name: 筛选并生成订阅
        run: python3 ci_build.py --keep 40 --delay-limit 3000

      - name: 提交结果
        id: commit
        run: |
          set -uo pipefail
          git config user.name  "nodepool-bot"
          git config user.email "bot@users.noreply.github.com"
          # sources_report.json 必须显式列出: 这里不是 git add -A, 只点名的文件才进提交。
          # 漏了它, 云端每轮都生成了体检报告, 但仓库里永远看不到。
          git add -A out data/pool_history.json data/nodes.json data/sources_report.json
          if git diff --staged --quiet; then
            echo "没有变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: 更新订阅 $(date -u +%Y-%m-%d)"
            # fetch 窗口里如果有人也在推(手动改代码、另一个 run 刚提交),
            # 裸 git push 会被拒, 整个 run 变红但产物没提交 —— 跑过 #12 就是这样。
            # 现在每 3 小时一次, 撞上的机会比以前多 8 倍, 所以带重试。
            pushed=0
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              echo "::warning::推送被拒(第 $i 次), 拉取最新后重试"
              git pull --rebase -X theirs origin main \
                || git rebase --abort 2>/dev/null || true
              sleep 3
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::连续 3 次推送失败, 本轮产物未提交(下一轮会重来)"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 刷新 CDN 缓存
        # 订阅走 jsDelivr(国内可直连)，但它把 branch 引用缓存最长 12 小时。
        # 两个坑，都踩过：
        #   1) 清缓存不能早于 GitHub 自身分发 —— 否则 jsDelivr 回源拿到旧文件，
        #      结果是"新文件要等 12 小时"，比不清更糟。所以先轮询 raw 确认已分发。
        #   2) jsDelivr 对同一文件约 1 小时只放 1 次清除，连清会被 throttled。
        #      所以只清一次，之后只做轮询校验，不再重复清。
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -uo pipefail
          REPO="${GITHUB_REPOSITORY}"
          EXPECT="$(head -1 out/sub.yaml)"     # 仓库里这份的真实时间戳
          echo "目标版本: $EXPECT"

          echo "· 等待 GitHub 分发新文件…"
          distributed=0
          for i in $(seq 1 6); do
            got="$(curl -s --max-time 15 "https://raw.githubusercontent.com/${REPO}/main/out/sub.yaml" | head -1 || true)"
            if [ "$got" = "$EXPECT" ]; then
              echo "  ✓ 已分发（约 ${i}0 秒）"
              distributed=1
              break
            fi
            sleep 10
          done
          # 没分发完就绝对不要清缓存：jsDelivr 会回源到旧文件并缓存 12 小时，
          # 比不清更糟。宁可让它自然过期。
          if [ "$distributed" != "1" ]; then
            echo "::warning::GitHub 60 秒内未分发完，跳过清缓存（jsDelivr 最迟 12 小时自然过期）"
            echo "主用地址是实时回源的，不受影响。"
            exit 0
          fi

          echo "· 请求清除缓存（每文件 1 次）"
          throttled=0
          for f in out/sub.yaml out/sub-base64.txt; do
            r="$(curl -s --max-time 20 "https://purge.jsdelivr.net/gh/${REPO}@main/${f}" || true)"
            if echo "$r" | grep -q '"throttled": true'; then
              echo "::warning::$f 被限流（1 小时内已清过），等自然过期"
              throttled=1
            else
              echo "  已清除 $f"
            fi
          done

          # 被限流就别白等 5 分钟了，反正清不掉。
          # 主用地址是实时回源的 gh-proxy/ghfast，不依赖这里。
          if [ "$throttled" = "1" ]; then
            echo "跳过 CDN 轮询：本次未能清除缓存，jsDelivr 最迟 12 小时自然过期。"
            echo "（订阅主用地址是实时回源的，不受影响）"
            exit 0
          fi

          echo "· 轮询校验 CDN 内容"
          for i in $(seq 1 20); do
            sleep 15
            got="$(curl -s --max-time 15 "https://cdn.jsdelivr.net/gh/${REPO}@main/out/sub.yaml" | head -1 || true)"
            echo "  第 ${i} 次: ${got}"
            if [ "$got" = "$EXPECT" ]; then
              echo "✅ CDN 已同步到最新"
              exit 0
            fi
          done
          echo "::warning::CDN 仍未同步，最迟 12 小时后自动过期"

      - name: 保存产物(便于在 Actions 页面直接下载)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscription-${{ github.run_number }}
          path: |
            out/sub.yaml
            out/sub-base64.txt
            out/report.md
          retention-days: 14

  # --------------------------------------------------------------------
  # 手机端反馈: 提一个 issue 说"哪几个节点不行", 这里把它们标记为不可用,
  # 然后触发一次重建。全程在云端完成, 不需要用户电脑开机, 也不需要我在场。
  # 处理结果会直接回复在这条 issue 下面, 手机上一眼就能看到。
  # --------------------------------------------------------------------
  report:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 解析反馈
        id: mark
        # 用环境变量传 issue 内容, 不直接拼进 shell —— 正文里带引号或反引号
        # 会被当成命令执行。
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -uo pipefail
          pip install --quiet pyyaml
          printf '%s\n%s\n' "$ISSUE_TITLE" "$ISSUE_BODY" > /tmp/body.txt
          echo "--- 反馈内容 ---"
          cat /tmp/body.txt
          echo "----------------"
          # mark.py 自己往 $GITHUB_OUTPUT 写 marked / rebuild, 不靠退出码传状态。
          # 退出码 2 只表示"没认出任何节点", 不算故障。
          rc=0
          python3 mark.py --text "@/tmp/body.txt" || rc=$?
          if [ "$rc" = "2" ]; then
            echo "::notice::反馈里没有识别到节点, 不做处理"
          elif [ "$rc" != "0" ]; then
            echo "::error::处理反馈时出错 (退出码 $rc)"
            exit "$rc"
          fi
          echo "--- 解析结果 ---"
          cat /tmp/mark_summary.txt 2>/dev/null || true

      - name: 提交标记
        id: push
        if: steps.mark.outputs.marked != '0' && steps.mark.outputs.marked != ''
        run: |
          set -uo pipefail
          git config user.name  "nodepool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/cn_pref.json
          if git diff --staged --quiet; then
            echo "这些节点之前已被标记过, 无需重复提交"
            exit 0
          fi
          git commit -q -m "chore: 按反馈标记节点不可用 (#${{ github.event.issue.number }})"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "::warning::推送被拒(第 $i 次), 重试"
            git pull --rebase -X theirs origin main || git rebase --abort 2>/dev/null || true
            sleep 3
          done
          echo "::error::推送失败"
          exit 1

      - name: 触发重建
        id: dispatch
        if: steps.mark.outputs.rebuild == 'true'
        # 这次提交只动了 data/, 而 paths-ignore 里排除了 data/**，不会自动触发
        # build。这里显式 dispatch 一次。workflow_dispatch 那轮会跑采集步骤，
        # 所以"整体都不行"也能拿到一批新的候选节点。
        run: |
          set -uo pipefail
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch HTTP $code"
          [ "$code" = "204" ] || { cat /tmp/resp.json; exit 1; }

      - name: 在 issue 里回复结果
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NO: ${{ github.event.issue.number }}
          MARKED: ${{ steps.mark.outputs.marked }}
          REBUILD: ${{ steps.mark.outputs.rebuild }}
          MARK_OUTCOME: ${{ steps.mark.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          set -uo pipefail
          {
            if [ "$MARK_OUTCOME" != "success" ]; then
              echo "⚠️ 处理反馈时出错了，把这条 issue 的内容再发一次，或者直接找我说一声。"
            elif [ "$MARKED" = "0" ] && [ "$REBUILD" != "true" ]; then
              echo "没认出是哪个节点。写序号（N05 / 第5个 / 5号）或者 IP 都行。"
            else
              echo "✅ 收到，云端已处理完。"
              echo ""
              cat /tmp/mark_summary.txt 2>/dev/null || true
              echo ""
              if [ "$REBUILD" = "true" ] && [ "$DISPATCH_OUTCOME" = "success" ]; then
                echo "订阅重建已触发，约 1~2 分钟后在客户端点一次「更新订阅」即可。"
              elif [ "$MARKED" != "0" ] && [ "$PUSH_OUTCOME" != "success" ]; then
                echo "标记写好了但提交失败，下一次定时任务（最多 3 小时）会自动带上。"
              elif [ "$REBUILD" = "true" ]; then
                echo "重建触发失败，但标记已保存，下一次定时任务（最多 3 小时）会自动带上。"
              fi
              echo ""
              echo "标记 7 天后自动失效 —— 如果只是临时抽风，到时会自己回到候选池。"
            fi
          } > /tmp/comment.md
          jq -n --rawfile b /tmp/comment.md '{body: $b}' > /tmp/payload.json
          code=$(curl -sS -o /tmp/c.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NO/comments" \
            -d @/tmp/payload.json)
          echo "comment HTTP $code"
          if [ "$code" != "201" ]; then cat /tmp/c.json; fi

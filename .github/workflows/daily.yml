name: 每日更新节点订阅

on:
  schedule:
    # UTC 20:00 = 北京时间 04:00。改时间改这里（注意是 UTC）。
    - cron: "0 20 * * *"
  workflow_dispatch: {}      # 支持手动点一下立即跑
  push:
    branches: [main]
    # 只在自己改代码时跑。机器人提交的产物(out/、data/)不触发，
    # 否则每次提交都会再跑一轮，形成无限循环。
    paths-ignore:
      - "out/**"
      - "data/**"
      - "*.md"
      - "**/*.md"

permissions:
  contents: write            # 需要把产物 commit 回仓库

concurrency:
  group: daily-sub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 下载 mihomo 内核
        run: |
          set -euo pipefail
          mkdir -p bin data out
          URL=$(curl -sL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux-amd64.*\\.gz$"))
                     | select(.name | test("compatible") | not)
                     | .browser_download_url' | head -1)
          echo "下载: $URL"
          curl -sL -o /tmp/m.gz "$URL"
          gunzip -c /tmp/m.gz > bin/mihomo
          chmod +x bin/mihomo
          ./bin/mihomo -v

      - name: 采集节点
        run: |
          set -uo pipefail
          # 云端直连, 不需要代理。失败了也继续 —— 用仓库里上一次的 nodes.json 重测。
          python3 collect.py --max-age 72 || echo "::warning::采集失败, 沿用上一次的节点列表"

      - name: 筛选并生成订阅
        run: python3 ci_build.py --keep 40 --delay-limit 3000

      - name: 提交结果
        id: commit
        run: |
          set -uo pipefail
          git config user.name  "nodepool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A out data/pool_history.json data/nodes.json
          if git diff --staged --quiet; then
            echo "没有变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: 更新订阅 $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 刷新 CDN 缓存
        # 订阅走 jsDelivr(国内可直连)，但它把 branch 引用缓存最长 12 小时。
        # 两个坑，都踩过：
        #   1) 清缓存不能早于 GitHub 自身分发 —— 否则 jsDelivr 回源拿到旧文件，
        #      结果是"新文件要等 12 小时"，比不清更糟。所以先轮询 raw 确认已分发。
        #   2) jsDelivr 对同一文件约 1 小时只放 1 次清除，连清会被 throttled。
        #      所以只清一次，之后只做轮询校验，不再重复清。
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -uo pipefail
          REPO="${GITHUB_REPOSITORY}"
          EXPECT="$(head -1 out/sub.yaml)"     # 仓库里这份的真实时间戳
          echo "目标版本: $EXPECT"

          echo "· 等待 GitHub 分发新文件…"
          distributed=0
          for i in $(seq 1 18); do
            got="$(curl -s --max-time 15 "https://raw.githubusercontent.com/${REPO}/main/out/sub.yaml" | head -1 || true)"
            if [ "$got" = "$EXPECT" ]; then
              echo "  ✓ 已分发（约 ${i}0 秒）"
              distributed=1
              break
            fi
            sleep 10
          done
          if [ "$distributed" != "1" ]; then
            echo "::warning::GitHub 分发超时，仍尝试清缓存（可能失败）"
          fi

          echo "· 请求清除缓存（每文件 1 次）"
          for f in out/sub.yaml out/sub-base64.txt; do
            r="$(curl -s --max-time 20 "https://purge.jsdelivr.net/gh/${REPO}@main/${f}" || true)"
            if echo "$r" | grep -q '"throttled": true'; then
              echo "::warning::$f 被限流（1 小时内已清过），等自然过期"
            else
              echo "  已清除 $f"
            fi
          done

          echo "· 轮询校验 CDN 内容"
          for i in $(seq 1 20); do
            sleep 15
            got="$(curl -s --max-time 15 "https://cdn.jsdelivr.net/gh/${REPO}@main/out/sub.yaml" | head -1 || true)"
            echo "  第 ${i} 次: ${got}"
            if [ "$got" = "$EXPECT" ]; then
              echo "✅ CDN 已同步到最新"
              exit 0
            fi
          done
          echo "::warning::CDN 仍未同步，最迟 12 小时后自动过期"

      - name: 保存产物(便于在 Actions 页面直接下载)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscription-${{ github.run_number }}
          path: |
            out/sub.yaml
            out/sub-base64.txt
            out/report.md
          retention-days: 14
